name: Deploy

# Every push to main is tested and, when the server secrets are set, deployed to the VPS.
# Setup: deploy/README.md → «Автоматический деплой из GitHub».
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets are not set yet — skipping deploy
        if: ${{ env.VPS_HOST == '' }}
        run: echo "::notice::Add VPS_HOST and VPS_SSH_KEY in Settings → Secrets and variables → Actions to deploy automatically."
      - name: Deploy to VPS
        if: ${{ env.VPS_HOST != '' }}
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts; fi
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes" bash deploy/deploy.sh "${VPS_USER:-root}@$VPS_HOST"
